<text x="655.0" y="846.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Lichtwerte aus dem Beet</tspan></text>
<text x="655.0" y="864.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">liest noch niemand, später die</text>
<text x="655.0" y="882.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Messwerte zurück in den Planer</text>
<rect x="485" y="720" width="340" height="78" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="655.0" y="746.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Rezept vom Chatbot</tspan></text>
<text x="655.0" y="764.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Pflanze, Lichtziel, Temperatur,</text>
<text x="655.0" y="782.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Strom und Schattenstunden</text>
