<text x="161.0" y="764.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">10 Gemüse aus dem Gedächtnis:</text>
<text x="161.0" y="782.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Lichtziel, höchste Temperatur</text>
<rect x="320" y="720" width="130" height="78" rx="8" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="385.0" y="755.4" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Chatbot</tspan></text>
<text x="385.0" y="773.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">im Server</text>
