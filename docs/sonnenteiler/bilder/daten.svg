<text x="655.0" y="409.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">days.csv</tspan></text>
<text x="655.0" y="427.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Tagesbilanz je Tag, Rezept und Strategie:</text>
<text x="655.0" y="445.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Energie, Licht, Stress, Stromerlös</text>
<rect x="485" y="480" width="340" height="84" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="655.0" y="509.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">plans.csv</tspan></text>
<text x="655.0" y="527.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">beste Pläne je Rezept, Wetter und Preise</text>
<text x="655.0" y="545.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">im Voraus bekannt</text>
<rect x="485" y="580" width="340" height="84" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="655.0" y="609.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">alternatives.csv</tspan></text>
<text x="655.0" y="627.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">je Schritt alle 10 Stellungen:</text>
<text x="655.0" y="645.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Strom und Licht an der Pflanze</text>
<rect x="30" y="720" width="262" height="78" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
