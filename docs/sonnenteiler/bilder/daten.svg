<text x="385.0" y="396.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">generate.py</tspan></text>
<text x="385.0" y="414.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">schreibt den</text>
<text x="385.0" y="432.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Datensatz</text>
<rect x="30" y="150" width="262" height="78" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="161.0" y="176.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Open Meteo</tspan> (echt)</text>
<text x="161.0" y="194.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Wetter gemessen, stündlich,</text>
<text x="161.0" y="212.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">und Vorhersage vom Vortag</text>
<rect x="30" y="238" width="262" height="78" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="161.0" y="264.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Energy Charts</tspan> (echt)</text>
<text x="161.0" y="282.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Strompreis Österreich,</text>
<text x="161.0" y="300.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Börse vom Vortag, stündlich</text>
<rect x="30" y="326" width="262" height="78" rx="8" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="161.0" y="361.4" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Sonnenstand</tspan> (echt)</text>
<text x="161.0" y="379.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">berechnet aus Ort und Uhrzeit</text>
<rect x="30" y="414" width="262" height="78" rx="8" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="161.0" y="440.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Formel Modul</tspan> (Modell)</text>
<text x="161.0" y="458.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Strom = Licht auf dem Modul</text>
<text x="161.0" y="476.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">mal Fläche mal 15 %</text>
<rect x="30" y="502" width="262" height="78" rx="8" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="161.0" y="528.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Formel Pflanze</tspan> (Modell)</text>
<text x="161.0" y="546.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Licht durch die Lücken,</text>
<text x="161.0" y="564.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Abdeckungsgrad 0,35</text>
<rect x="30" y="590" width="262" height="78" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="161.0" y="616.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">recipes.json</tspan> (Annahme)</text>
<text x="161.0" y="634.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">4 Kulturen, Werte von Hand:</text>
<text x="161.0" y="652.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Lichtziel und Grenzen</text>
<rect x="485" y="180" width="340" height="84" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="655.0" y="210.1" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">meta.json</tspan></text>
<text x="655.0" y="228.3" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Ort, Modul, Rezepte, jede Spalte mit Einheit</text>
<text x="655.0" y="245.2" font-size="13" fill="#1f2328" text-anchor="middle" xml:space="preserve">aus: recipes.json und Einstellungen</text>
<rect x="485" y="280" width="340" height="84" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="655.0" y="301.2" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">steps.csv</tspan></text>
<text x="655.0" y="319.4" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">alle 5 Minuten: Sonne, Wetter, Vorhersage,</text>
<text x="655.0" y="337.3" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Strompreis, Werte beim Nachführen</text>
<text x="655.0" y="354.2" font-size="13" fill="#1f2328" text-anchor="middle" xml:space="preserve">aus: Open Meteo, Energy Charts, Sonne, Formeln</text>
