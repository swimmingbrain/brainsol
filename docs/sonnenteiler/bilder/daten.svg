<text x="161.0" y="846.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Vier Lichtmodule im Beet</tspan></text>
<text x="161.0" y="864.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">(echt, sobald angeschlossen)</text>
<text x="161.0" y="882.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Licht an vier Punkten</text>
