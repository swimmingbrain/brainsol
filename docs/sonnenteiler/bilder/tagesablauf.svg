<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="770" viewBox="0 0 1250 770" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Ein Tag: was wann passiert</title>
<defs>
<marker id="a1a5fb4" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1a5fb4"/></marker>
<marker id="sa1a5fb4" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1a5fb4"/></marker>
<marker id="a1f2328" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2328"/></marker>
<marker id="sa1f2328" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1f2328"/></marker>
</defs>
<rect width="1250" height="770" fill="#ffffff"/>
<rect x="30" y="230" width="1190" height="250" rx="10" fill="#f3f4f5" stroke="#1f2328" stroke-width="1.8"/>
<text x="42.0" y="253.0" font-size="15" fill="#1f2328" text-anchor="start" xml:space="preserve"><tspan font-weight="bold">Jeder Block von 3 Stunden, hier 9 bis 12 Uhr</tspan></text>
<polyline points="250.0,125.0 300.0,125.0" fill="none" stroke="#1a5fb4" stroke-width="1.6" marker-end="url(#a1a5fb4)"/>
<polyline points="956.0,125.0 1010.0,125.0" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a1f2328)"/>
<polyline points="546.0,152.0 327.5,230.0" fill="none" stroke="#1f2328" stroke-width="1.0"/>
<polyline points="628.0,152.0 922.5,230.0" fill="none" stroke="#1f2328" stroke-width="1.0"/>
<polyline points="256.0,363.0 298.0,363.0" fill="none" stroke="#1a5fb4" stroke-width="1.6" marker-end="url(#a1a5fb4)"/>
<polyline points="494.0,363.0 536.0,363.0" fill="none" stroke="#1a5fb4" stroke-width="1.6" marker-end="url(#a1a5fb4)"/>
<polyline points="732.0,363.0 774.0,363.0" fill="none" stroke="#1a5fb4" stroke-width="1.6" marker-end="url(#a1a5fb4)"/>
<polyline points="970.0,363.0 1012.0,363.0" fill="none" stroke="#1a5fb4" stroke-width="1.6" marker-end="url(#a1a5fb4)"/>
<polyline points="1110.0,305.0 1110.0,282.0 158.0,282.0 158.0,305.0" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a1f2328)"/>
<polyline points="634.0,520.0 634.0,421.0" fill="none" stroke="#1a5fb4" stroke-width="1.6" marker-end="url(#a1a5fb4)"/>
<text x="30.0" y="42.6" font-size="21" fill="#1f2328" text-anchor="start" xml:space="preserve"><tspan font-weight="bold">Ein Tag: was wann passiert</tspan></text>
<rect x="30" y="70" width="220" height="110" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="140.0" y="103.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Am Vorabend</tspan></text>
<text x="140.0" y="121.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">bekannt: Börsenpreise</text>
<text x="140.0" y="139.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">für jede Stunde und die</text>
<text x="140.0" y="157.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Vorhersage des Wetterdienstes</text>
<rect x="300" y="98" width="82" height="54" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.8"/>
<text x="341.0" y="130.0" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">0 bis 3</text>
<rect x="382" y="98" width="82" height="54" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.8"/>
<text x="423.0" y="130.0" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">3 bis 6</text>
<rect x="464" y="98" width="82" height="54" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.8"/>
<text x="505.0" y="130.0" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">6 bis 9</text>
<rect x="546" y="98" width="82" height="54" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.8"/>
<text x="587.0" y="130.0" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">9 bis 12</text>
<rect x="628" y="98" width="82" height="54" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.8"/>
<text x="669.0" y="130.0" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">12 bis 15</text>
<rect x="710" y="98" width="82" height="54" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.8"/>
<text x="751.0" y="130.0" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">15 bis 18</text>
<rect x="792" y="98" width="82" height="54" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.8"/>
<text x="833.0" y="130.0" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">18 bis 21</text>
<rect x="874" y="98" width="82" height="54" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.8"/>
<text x="915.0" y="130.0" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">21 bis 24</text>
<text x="300.0" y="85.7" font-size="13" fill="#1f2328" text-anchor="start" xml:space="preserve">alle 3 Stunden ein neuer Plan, die nächsten 3 Stunden sind bindend</text>
<rect x="1010" y="70" width="210" height="110" rx="8" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="1115.0" y="103.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Um Mitternacht</tspan></text>
<text x="1115.0" y="121.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Tagesbilanz: Sonnenteiler</text>
<text x="1115.0" y="139.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">gegen Nachführen, Pflanze</text>
<text x="1115.0" y="157.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">zuerst und besten Plan</text>
<rect x="60" y="305" width="196" height="116" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="158.0" y="341.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">1 Messen</tspan></text>
<text x="158.0" y="359.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">was Sonne und Wetter</text>
<text x="158.0" y="377.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">bis jetzt wirklich</text>
<text x="158.0" y="395.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">gebracht haben</text>
<rect x="298" y="305" width="196" height="116" rx="8" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="396.0" y="332.6" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">2 Vorhersage</tspan></text>
<text x="396.0" y="350.8" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">kleines Netz, gelernt,</text>
<text x="396.0" y="368.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">korrigiert den</text>
<text x="396.0" y="386.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Wetterdienst mit dem</text>
<text x="396.0" y="404.5" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">heute Gemessenen</text>
<rect x="536" y="305" width="196" height="116" rx="8" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="634.0" y="341.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">3 Planen</tspan></text>
<text x="634.0" y="359.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">die sechs Regeln für</text>
<text x="634.0" y="377.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">den Rest des Tages,</text>
<text x="634.0" y="395.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">3 Stunden bindend</text>
<rect x="774" y="305" width="196" height="116" rx="8" fill="#fdeeec" stroke="#b42318" stroke-width="1.8"/>
<text x="872.0" y="341.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">4 Fahren</tspan></text>
<text x="872.0" y="359.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">alle 5 Minuten eine neue</text>
<text x="872.0" y="377.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Pose, ein Wegdrehwinkel</text>
<text x="872.0" y="395.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">pro Stunde</text>
<rect x="1012" y="305" width="196" height="116" rx="8" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="1110.0" y="341.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">5 Rückblick</tspan></text>
<text x="1110.0" y="359.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Block nachrechnen:</text>
<text x="1110.0" y="377.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">gefahren, versprochen,</text>
<text x="1110.0" y="395.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">bestes im Nachhinein</text>
<rect x="484.0" y="520" width="300" height="70" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="634.0" y="551.4" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Neues Rezept</tspan></text>
<text x="634.0" y="569.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">vom Chatbot oder von Hand</text>
<rect x="30" y="620" width="760" height="64" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.8"/>
<text x="38.0" y="648.1" font-size="14" fill="#1f2328" text-anchor="start" xml:space="preserve"><tspan font-weight="bold">In der Simulation</tspan> spielt der Planer echte Tage des Datensatzes nach, 360mal so schnell:</text>
<text x="38.0" y="666.0" font-size="14" fill="#1f2328" text-anchor="start" xml:space="preserve">ein Block dauert 30 s. Eine Schattenkopie fährt im selben Wetter nur der Sonne nach, zum Vergleich.</text>
<rect x="30" y="718" width="28" height="18" rx="3" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.4"/>
<text x="66.0" y="731.7" font-size="13" fill="#1f2328" text-anchor="start" xml:space="preserve">Daten</text>
<rect x="142" y="718" width="28" height="18" rx="3" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.4"/>
<text x="178.0" y="731.7" font-size="13" fill="#1f2328" text-anchor="start" xml:space="preserve">Logik</text>
<rect x="249" y="718" width="28" height="18" rx="3" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
<text x="285.0" y="731.7" font-size="13" fill="#1f2328" text-anchor="start" xml:space="preserve">Oberfläche und Mensch</text>
<rect x="471" y="718" width="28" height="18" rx="3" fill="#fdeeec" stroke="#b42318" stroke-width="1.4"/>
<text x="507.0" y="731.7" font-size="13" fill="#1f2328" text-anchor="start" xml:space="preserve">Hardware</text>
<line x1="603" y1="727.0" x2="643" y2="727.0" stroke="#1f2328" stroke-width="1.6"/>
<text x="651.0" y="731.7" font-size="13" fill="#1f2328" text-anchor="start" xml:space="preserve">läuft heute</text>
<line x1="757" y1="727.0" x2="797" y2="727.0" stroke="#1f2328" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="805.0" y="731.7" font-size="13" fill="#1f2328" text-anchor="start" xml:space="preserve">gebaut, läuft noch nicht</text>
<rect x="586.1" y="259.7" width="95.8" height="20.6" fill="#ffffff" fill-opacity="0.92"/>
<text x="634.0" y="274.7" font-size="13" fill="#1f2328" text-anchor="middle">nächster Block</text>
<rect x="648.3" y="440.4" width="111.5" height="20.6" fill="#ffffff" fill-opacity="0.92"/>
<text x="704.0" y="455.4" font-size="13" fill="#1f2328" text-anchor="middle">sofort neu planen</text>
</svg>
