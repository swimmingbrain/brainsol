<text x="30.0" y="42.6" font-size="21" fill="#1f2328" text-anchor="start" xml:space="preserve"><tspan font-weight="bold">Die Entscheidungen: wann die Pflanze ihr Licht bekommt</tspan></text>
<rect x="330" y="170" width="210" height="190" rx="8" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="435.0" y="243.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Planer</tspan></text>
<text x="435.0" y="261.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">alle 3 Stunden für</text>
<text x="435.0" y="279.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">jede Stunde des</text>
<text x="435.0" y="297.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">restlichen Tages</text>
<rect x="30" y="90" width="240" height="74" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="150.0" y="114.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Strompreis</tspan></text>
<text x="150.0" y="132.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">jede Stunde, Börse vom</text>
<text x="150.0" y="150.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Vortag, kann unter 0 sein</text>
<rect x="30" y="180" width="240" height="74" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="150.0" y="204.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Rezept</tspan></text>
<text x="150.0" y="222.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Lichtziel, Grenzen, Strom</text>
<text x="150.0" y="240.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">und Schattenstunden</text>
<rect x="30" y="270" width="240" height="74" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="150.0" y="294.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Vorhersage</tspan></text>
<text x="150.0" y="312.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Licht und Temperatur für</text>
<text x="150.0" y="330.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">den Rest des Tages</text>
<rect x="30" y="360" width="240" height="74" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="150.0" y="384.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Lichtkonto</tspan></text>
<text x="150.0" y="402.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">was die Pflanze heute</text>
<text x="150.0" y="420.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">schon bekommen hat</text>
<polygon points="740.0,80 880,128.0 740.0,176 600,128.0" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="740.0" y="124.1" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Stromstunde</text>
<text x="740.0" y="142.0" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">im Rezept?</text>
<polygon points="740.0,215 880,263.0 740.0,311 600,263.0" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="740.0" y="259.1" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Schattenstunde</text>
<text x="740.0" y="277.0" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">im Rezept?</text>
<rect x="620" y="350" width="240" height="70" rx="8" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="740.0" y="381.4" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Schutz</tspan></text>
<text x="740.0" y="399.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">nur Stellungen ohne Stress</text>
<polygon points="740.0,460 880,508.0 740.0,556 600,508.0" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="740.0" y="504.1" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Braucht das Lichtziel</text>
<text x="740.0" y="522.0" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">diese Stunde?</text>
<polygon points="740.0,595 880,643.0 740.0,691 600,643.0" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="740.0" y="639.1" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Strompreis</text>
<text x="740.0" y="657.0" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">unter 0?</text>
<rect x="950" y="95" width="280" height="66" rx="8" fill="#fdeeec" stroke="#b42318" stroke-width="1.8"/>
<text x="1090.0" y="124.4" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">zur Sonne</tspan></text>
<text x="1090.0" y="142.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">der meiste Strom</text>
<rect x="950" y="225" width="280" height="76" rx="8" fill="#fdeeec" stroke="#b42318" stroke-width="1.8"/>
<text x="1090.0" y="250.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">wenig Licht</tspan></text>
<text x="1090.0" y="268.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Stellung mit dem wenigsten</text>
<text x="1090.0" y="286.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Licht an der Pflanze</text>
<rect x="950" y="470" width="280" height="76" rx="8" fill="#fdeeec" stroke="#b42318" stroke-width="1.8"/>
<text x="1090.0" y="495.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">wegdrehen</tspan></text>
<text x="1090.0" y="513.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">so weit, wie das Lichtziel</text>
<text x="1090.0" y="531.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">es braucht (Pflicht)</text>
<rect x="950" y="610" width="280" height="66" rx="8" fill="#fdeeec" stroke="#b42318" stroke-width="1.8"/>
<text x="1090.0" y="639.4" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">wegdrehen</tspan></text>
<text x="1090.0" y="657.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">weniger Strom, mehr Erlös</text>
<rect x="640" y="735" width="200" height="66" rx="8" fill="#fdeeec" stroke="#b42318" stroke-width="1.8"/>
<text x="740.0" y="764.4" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">zur Sonne</tspan></text>
<text x="740.0" y="782.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">der meiste Erlös</text>
<rect x="30" y="470" width="510" height="140" rx="8" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="38.0" y="500.6" font-size="15" fill="#1f2328" text-anchor="start" xml:space="preserve"><tspan font-weight="bold">Welche Stunden das Licht bekommen</tspan></text>
<text x="38.0" y="518.8" font-size="14" fill="#1f2328" text-anchor="start" xml:space="preserve">die, in denen ein mol Licht am wenigsten</text>
<text x="38.0" y="536.7" font-size="14" fill="#1f2328" text-anchor="start" xml:space="preserve">Erlös kostet. Stunden unter 0 zuerst, dort</text>
<text x="38.0" y="554.6" font-size="14" fill="#1f2328" text-anchor="start" xml:space="preserve">bringt Wegdrehen sogar Geld. Schafft der Tag</text>
<text x="38.0" y="572.6" font-size="14" fill="#1f2328" text-anchor="start" xml:space="preserve">das Ziel nicht, bekommt die Pflanze jede</text>
<text x="38.0" y="590.5" font-size="14" fill="#1f2328" text-anchor="start" xml:space="preserve">Stunde das meiste Licht.</text>
<text x="30.0" y="866.1" font-size="17" fill="#1f2328" text-anchor="start" xml:space="preserve"><tspan font-weight="bold">Wie das Geld entsteht</tspan></text>
<rect x="30" y="900" width="220" height="90" rx="8" fill="#fdeeec" stroke="#b42318" stroke-width="1.8"/>
<text x="140.0" y="932.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Modul</tspan></text>
<text x="140.0" y="950.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">macht Strom, je nach</text>
<text x="140.0" y="968.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Stellung mehr oder weniger</text>
<rect x="330" y="900" width="190" height="90" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="425.0" y="941.4" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Strom</tspan></text>
<text x="425.0" y="959.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">kWh in jeder Stunde</text>
<rect x="330" y="1020" width="190" height="80" rx="8" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.8"/>
<text x="425.0" y="1056.4" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Börsenpreis</tspan></text>
<text x="425.0" y="1074.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">derselben Stunde</text>
<rect x="580" y="900" width="270" height="200" rx="8" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="715.0" y="960.6" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Erlös</tspan></text>
<text x="715.0" y="978.8" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Strom mal Börsenpreis,</text>
<text x="715.0" y="996.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">über den Tag summiert,</text>
<text x="715.0" y="1014.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">pro m² Boden,</text>
<text x="715.0" y="1032.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">mal 10 000 = € pro Hektar.</text>
<text x="715.0" y="1050.5" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Nur Strom bringt Geld.</text>
<rect x="920" y="900" width="330" height="90" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="1.8"/>
<text x="1085.0" y="941.4" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Seite des Planers</tspan></text>
<text x="1085.0" y="959.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Erlös heute gegen Nachführen</text>
<rect x="920" y="1010" width="330" height="70" rx="8" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="1085.0" y="1041.4" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Was das Licht der Pflanze kostet</tspan></text>
<text x="1085.0" y="1059.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Nachführen minus Sonnenteiler</text>
<rect x="920" y="1100" width="330" height="80" rx="8" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.8"/>
<text x="1085.0" y="1127.5" font-size="15" fill="#1f2328" text-anchor="middle" xml:space="preserve"><tspan font-weight="bold">Was der Blick auf den Preis bringt</tspan></text>
<text x="1085.0" y="1145.7" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">Sonnenteiler minus Pflanze</text>
<text x="1085.0" y="1163.6" font-size="14" fill="#1f2328" text-anchor="middle" xml:space="preserve">zuerst ohne Preisblick</text>
<rect x="30" y="1208" width="28" height="18" rx="3" fill="#eaf2fb" stroke="#1a5fb4" stroke-width="1.4"/>
<text x="66.0" y="1221.7" font-size="13" fill="#1f2328" text-anchor="start" xml:space="preserve">Daten</text>
<rect x="142" y="1208" width="28" height="18" rx="3" fill="#e9f6ec" stroke="#1e7b34" stroke-width="1.4"/>
<text x="178.0" y="1221.7" font-size="13" fill="#1f2328" text-anchor="start" xml:space="preserve">Logik</text>
<rect x="249" y="1208" width="28" height="18" rx="3" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
<text x="285.0" y="1221.7" font-size="13" fill="#1f2328" text-anchor="start" xml:space="preserve">Oberfläche und Mensch</text>
<rect x="471" y="1208" width="28" height="18" rx="3" fill="#fdeeec" stroke="#b42318" stroke-width="1.4"/>
<text x="507.0" y="1221.7" font-size="13" fill="#1f2328" text-anchor="start" xml:space="preserve">Hardware</text>
<line x1="603" y1="1217.0" x2="643" y2="1217.0" stroke="#1f2328" stroke-width="1.6"/>
<text x="651.0" y="1221.7" font-size="13" fill="#1f2328" text-anchor="start" xml:space="preserve">läuft heute</text>
<line x1="757" y1="1217.0" x2="797" y2="1217.0" stroke="#1f2328" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="805.0" y="1221.7" font-size="13" fill="#1f2328" text-anchor="start" xml:space="preserve">gebaut, läuft noch nicht</text>
<rect x="905.4" y="105.7" width="19.2" height="20.6" fill="#ffffff" fill-opacity="0.92"/>
<text x="915.0" y="120.7" font-size="13" fill="#1f2328" text-anchor="middle">ja</text>
<rect x="905.4" y="240.7" width="19.2" height="20.6" fill="#ffffff" fill-opacity="0.92"/>
