[project]
name = "brainsol-brain"
version = "0.2.0"
description = "the brain server of brainSOL: the recipe chatbot that turns a farmer's words into a few numbers, and the planner that plans the tracker for them"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "numpy>=1.21",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain", "sonnenteiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
